[project]
name = "atmoflux"
dynamic = ["version"]
description = "Atmospheric and energy flux analysis library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
authors = [{ name = "JustinGeoSci", email = "contact@justingeosci.dev" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "atmospheric science",
    "climate science",
    "meteorology",
    "surface energy balance",
    "land-atmosphere exchange",
    "energy fluxes",
    "radiative fluxes",
    "turbulent fluxes",
    "hydrological fluxes",
    "boundary layer",
    "urban climate",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://justingeosci.dev/atmoflux/"
Source = "https://github.com/JustinGeoSci/atmoflux"
"Bug Tracker" = "https://github.com/JustinGeoSci/atmoflux/issues"
Citation = "https://doi.org/10.5281/zenodo.20470203"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["atmoflux*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "atmoflux.__version__" }
